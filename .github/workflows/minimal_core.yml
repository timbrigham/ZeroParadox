name: Minimal Core

# The "prove it yourself" gate. Re-checks ZeroParadox/Miniature.lean — the
# self-contained minimal core — and writes a dual-audience verification report
# to the run summary. workflow_dispatch fires it by hand against any branch. It also
# runs on every pull request into main and every push to main or illustrated, with no
# path filter: the four gating workflows (Complete Project, Verification suite, Axiom
# Ledger, Minimal Core) share one cadence on main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - illustrated
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify the Minimal Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Restore-only: "Complete Project" (lean_action_ci.yml) saves this cache after a green
      # full build, and its comment records what was verified about it. Miniature.lean imports
      # only Mathlib, so what this job gains is Mathlib and the other packages already in
      # place; `lake env lean` below re-elaborates the file itself on every run regardless.
      - name: Restore the Lake build cache
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.toml') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.toml') }}-
      # build: false keeps this job self-contained, as the header claims. Without it
      # lean-action builds the whole corpus first, so an unrelated breakage elsewhere
      # kills the job before the Minimal Core is ever elaborated. use-github-cache: false
      # because the step above is the cache (see lean_action_ci.yml).
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Re-elaborate the Minimal Core and write the report
        run: |
          # No pipefail on the elaboration: a failure must still REACH the report.
          # PIPESTATUS[0] carries Lean's real exit status past the tee - the report takes
          # it as the verdict, because deciding success from log text fails open (Lean
          # tags some diagnostics `error(lean.xxx):`, which contains no `error:`).
          lake env lean ZeroParadox/Miniature.lean 2>&1 | tee mc.log
          LEAN_RC=${PIPESTATUS[0]}
          echo "lake env lean exited ${LEAN_RC}"
          # pipefail IS required here. Without it the step inherits tee's exit status,
          # so the report's exit 1 was silently green and the "doubles as a CI gate"
          # property did not hold as wired.
          set -o pipefail
          python3 scripts/minimal_core_report.py mc.log "${LEAN_RC}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
