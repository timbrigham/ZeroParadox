name: Axiom Ledger

# The axiom-profile gate. Re-elaborates ZeroParadox/Meta/AxiomLedger.lean, whose `#eval`
# recomputes every ledgered declaration's axiom profile with the vendored auditor
# (ZeroParadox/Vendored/CorpusAudit/, from GuardianEngineAI/corpus) and throws on any mismatch,
# then writes a per-row report to the run summary. The same module is in the default build, so
# "Complete Project" also fails on drift; this job isolates it and shows the table. Fires on a
# toolchain or Mathlib bump too, because that is when a profile drifts. A last step checks the
# gate fails closed: a ledger with one planted wrong profile must come out red.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - illustrated
    paths:
      - 'ZeroParadox/Meta/AxiomLedger.lean'
      - 'ZeroParadox/Vendored/CorpusAudit/**'
      - 'ZeroParadox/Computability/KleeneChoiceFree.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/axiom_ledger_report.py'
      - '.github/workflows/axiom_ledger.yml'
      - 'AxiomLedgerControl.lean'
  pull_request:
    branches:
      - main
    paths:
      - 'ZeroParadox/Meta/AxiomLedger.lean'
      - 'ZeroParadox/Vendored/CorpusAudit/**'
      - 'ZeroParadox/Computability/KleeneChoiceFree.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/axiom_ledger_report.py'
      - '.github/workflows/axiom_ledger.yml'
      - 'AxiomLedgerControl.lean'

permissions:
  contents: read

jobs:
  verify:
    name: Verify the Axiom Ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # build: false keeps this job to the ledger's own import closure. Without it lean-action
      # builds the whole corpus first, so an unrelated breakage elsewhere kills the job before
      # the ledger is ever elaborated.
      - uses: leanprover/lean-action@v1
        with:
          build: false
      # The ledger's imports, plus the auditor's own admission fixtures (AuditChecks), whose
      # `#eval` fails this step if the checker ever accepts one of upstream's invalid cases.
      - name: Build the ledger's imports and the auditor's self-test
        run: |
          lake build ZeroParadox.Computability.KleeneChoiceFree \
            ZeroParadox.Vendored.CorpusAudit.Audit \
            ZeroParadox.Vendored.CorpusAudit.AuditChecks
      - name: Re-elaborate the ledger and write the report
        run: |
          # No pipefail on the elaboration: a failure must still REACH the report.
          # PIPESTATUS[0] carries Lean's real exit status past the tee - the report takes
          # it as the verdict, because deciding success from log text fails open.
          lake env lean ZeroParadox/Meta/AxiomLedger.lean 2>&1 | tee al.log
          LEAN_RC=${PIPESTATUS[0]}
          echo "lake env lean exited ${LEAN_RC}"
          # pipefail IS required here. Without it the step inherits tee's exit status,
          # so the report's exit 1 would be silently green.
          set -o pipefail
          python3 scripts/axiom_ledger_report.py al.log "${LEAN_RC}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The fail-closed control. AxiomLedgerControl.lean reruns the audit with ONE
      # planted defect, and this step fails the job unless Lean exits non-zero AND the audit's
      # failure list is exactly that row. It runs when an earlier step failed too; if the ledger
      # itself is red its module cannot build, so the control reports 'could not run', which only
      # keeps the job red. It is a separate step, so a red control cannot overwrite the real
      # verdict above.
      - name: "Control: a wrong declared profile must turn the gate red"
        if: ${{ !cancelled() }}
        env:
          CONTROL_FILE: AxiomLedgerControl.lean
        run: |
          EXPECTED='ZeroParadox.kleene_cf: declared [] ≠ computed [Quot.sound, propext]'
          verdict() { printf '\n### Control (expected red)\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if ! lake build ZeroParadox.Meta.AxiomLedger; then
            verdict "could not run: the ledger module did not build (expected whenever the ledger above is red) ✗"
            exit 1
          fi
          # No pipefail, as above: PIPESTATUS[0] carries Lean's exit status past the tee.
          lake env lean "${CONTROL_FILE}" 2>&1 | tee control.log
          CTRL_LEAN_RC=${PIPESTATUS[0]}
          # Everything after the audit's header: must be the one planted row and nothing else.
          FAILS=$(sed -n '/audit FAILED:/,$p' control.log | tail -n +2)
          echo "control: lean exit ${CTRL_LEAN_RC}, audit failures:"
          echo "${FAILS}"
          if [ "${CTRL_LEAN_RC}" -ne 0 ] && [ "${FAILS}" = "${EXPECTED}" ]; then
            verdict "planted defect caught ✓ (the planted profile for \`ZeroParadox.kleene_cf\` failed the audit, and nothing else did)"
          else
            verdict "NOT the expected red ✗: lean exit ${CTRL_LEAN_RC}, and the audit's failure list was not exactly the planted row. Either the gate is not failing closed or the control is broken; the step log shows which."
            exit 1
          fi
