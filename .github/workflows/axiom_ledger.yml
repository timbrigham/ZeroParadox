name: Axiom Ledger

# The axiom-profile gate. Re-elaborates ZeroParadox/Meta/AxiomLedger.lean, whose `#eval`
# recomputes every ledgered declaration's axiom profile with the vendored auditor
# (ZeroParadox/Vendored/CorpusAudit/, from GuardianEngineAI/corpus) and throws on any mismatch,
# then writes a per-row report to the run summary. The same module is in the default build, so
# "Complete Project" also fails on drift; this job isolates it and shows the table. Fires on a
# toolchain or Mathlib bump too, because that is when a profile drifts.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - illustrated
    paths:
      - 'ZeroParadox/Meta/AxiomLedger.lean'
      - 'ZeroParadox/Vendored/CorpusAudit/**'
      - 'ZeroParadox/Computability/KleeneChoiceFree.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/axiom_ledger_report.py'
      - '.github/workflows/axiom_ledger.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ZeroParadox/Meta/AxiomLedger.lean'
      - 'ZeroParadox/Vendored/CorpusAudit/**'
      - 'ZeroParadox/Computability/KleeneChoiceFree.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/axiom_ledger_report.py'
      - '.github/workflows/axiom_ledger.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify the Axiom Ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # build: false keeps this job to the ledger's own import closure. Without it lean-action
      # builds the whole corpus first, so an unrelated breakage elsewhere kills the job before
      # the ledger is ever elaborated.
      - uses: leanprover/lean-action@v1
        with:
          build: false
      # The ledger's imports, plus the auditor's own admission fixtures (AuditChecks), whose
      # `#eval` fails this step if the checker ever accepts one of upstream's invalid cases.
      - name: Build the ledger's imports and the auditor's self-test
        run: |
          lake build ZeroParadox.Computability.KleeneChoiceFree \
            ZeroParadox.Vendored.CorpusAudit.Audit \
            ZeroParadox.Vendored.CorpusAudit.AuditChecks
      - name: Re-elaborate the ledger and write the report
        run: |
          # No pipefail on the elaboration: a failure must still REACH the report.
          # PIPESTATUS[0] carries Lean's real exit status past the tee - the report takes
          # it as the verdict, because deciding success from log text fails open.
          lake env lean ZeroParadox/Meta/AxiomLedger.lean 2>&1 | tee al.log
          LEAN_RC=${PIPESTATUS[0]}
          echo "lake env lean exited ${LEAN_RC}"
          # pipefail IS required here. Without it the step inherits tee's exit status,
          # so the report's exit 1 would be silently green.
          set -o pipefail
          python3 scripts/axiom_ledger_report.py al.log "${LEAN_RC}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
