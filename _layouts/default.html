<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% elsif site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --border:#d0d7de;
  --accent:#1c6f88; --code-bg:#f6f8fa; --thead:#f6f8fa; --sel:#cfe6ee; --chrome:#fbfcfd;
  --maxw:46rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#30363d;
    --accent:#6fd3ec; --code-bg:#161b22; --thead:#161b22; --sel:#1f6feb55; --chrome:#0b0f16;
  }
}
:root[data-theme="light"]{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--border:#d0d7de;--accent:#1c6f88;--code-bg:#f6f8fa;--thead:#f6f8fa;--sel:#cfe6ee;--chrome:#fbfcfd}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--border:#30363d;--accent:#6fd3ec;--code-bg:#161b22;--thead:#161b22;--sel:#1f6feb55;--chrome:#0b0f16}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel)}
.site-header{border-bottom:1px solid var(--border);background:var(--chrome);
  padding:.9rem 1.4rem;display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
  position:sticky;top:0;z-index:5}
.site-header .brand{font-weight:700;font-size:1.05rem;color:var(--fg);text-decoration:none;letter-spacing:-.01em}
.site-header nav{margin-left:auto;display:flex;gap:1.15rem;font-size:.92rem}
.site-header nav a{color:var(--muted);text-decoration:none}
.site-header nav a:hover{color:var(--accent)}
main.content{max-width:var(--maxw);margin:0 auto;padding:2.6rem 1.4rem 3.5rem}
main.content>h1:first-child{margin-top:0}
h1{font-size:2.15rem;line-height:1.15;letter-spacing:-.021em;margin:0 0 .5em;font-weight:750;text-wrap:balance}
h2{font-size:1.5rem;margin:2.1em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--border);font-weight:680;letter-spacing:-.011em}
h3{font-size:1.16rem;margin:1.7em 0 .4em;font-weight:680}
p{margin:0 0 1.1em}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
strong{font-weight:680}
ul,ol{margin:0 0 1.1em;padding-left:1.45em}
li{margin:.32em 0}
li>ul,li>ol{margin:.3em 0}
code{font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;font-size:.85em;
  background:var(--code-bg);padding:.15em .38em;border-radius:5px}
pre{background:var(--code-bg);padding:1rem 1.1rem;border-radius:9px;overflow-x:auto;border:1px solid var(--border);line-height:1.5}
pre code{background:none;padding:0;font-size:.84em}
blockquote{margin:0 0 1.1em;padding:.35em 1.1em;border-left:3px solid var(--accent);color:var(--muted)}
blockquote p{margin:.4em 0}
hr{border:none;border-top:1px solid var(--border);margin:2.5em 0}
.table-wrap{overflow-x:auto;margin:0 0 1.3em}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--border);padding:.5em .7em;text-align:left;vertical-align:top}
th{background:var(--thead);font-weight:680;white-space:nowrap}
img{max-width:100%;height:auto;vertical-align:middle}
details{margin:0 0 1.1em;border:1px solid var(--border);border-radius:9px;padding:.5em 1em;background:var(--chrome)}
summary{cursor:pointer;font-weight:640}
.site-footer{max-width:var(--maxw);margin:0 auto;padding:1.8rem 1.4rem 3rem;border-top:1px solid var(--border);color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">The Zero Paradox</a>
  <nav>
    <a href="{{ '/' | relative_url }}">Formal Index</a>
    <a href="{{ '/GUIDE.html' | relative_url }}">Guide</a>
    <a href="{{ '/BOTTOMELEMENT.html' | relative_url }}">The Bottom &#8869;</a>
    <a href="{{ '/SNAP.html' | relative_url }}">The Snap</a>
  </nav>
</header>
<main class="content">
{{ content }}
</main>
<footer class="site-footer">
The Zero Paradox &middot; CC BY-NC-ND 4.0 &middot; <a href="https://github.com/timbrigham/ZeroParadox">GitHub</a> &middot; <a href="https://doi.org/10.5281/zenodo.20060860">DOI</a>
</footer>
</body>
</html>
