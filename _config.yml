title: The Zero Paradox
description: A machine-verified mathematical ontology.

# Apply the site theme to every rendered page. The root .md files carry no
# front matter, so this default is what wraps them in the layout.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Keep build tooling out of the published site. The PDFs, .md pages, AND the
# Lean sources under ZeroParadox/ are served, so the relative "check it yourself"
# citation links resolve on the site; only build artifacts/tooling are dropped.
exclude:
  - scripts/
  - lakefile.lean
  - lake-manifest.json
  - lean-toolchain
  - Gemfile
  - Gemfile.lock
  - "*.py"
